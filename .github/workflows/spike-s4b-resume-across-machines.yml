name: spike-s4b-resume-across-machines

# SPIKE S4B - THE GATING TEST. Restores the S4A snapshot onto a DIFFERENT
# fresh machine and asks the only question that matters for D2 and D3:
#
#   OQ-26  does a restored out/Default RESUME, or does it RESTART?
#
# The suspected failure mode is stated up front so the run can confirm or
# refute it rather than discover it by surprise: ninja decides staleness by
# comparing mtimes. A freshly re-fetched source tree gets NEW mtimes, newer
# than the restored object files, which could mark every edge dirty and cause
# a full rebuild despite a perfectly intact out/Default. Step B04 captures
# ninja's own explanation with -d explain so we get the REASON, not a guess.
#
# RULE 19: stages R00-R12 reproduced VERBATIM from spike-s3-compilerate.yml,
# because the restored tree is only comparable if it was produced identically.
# RULE 8/18: explicit PASS or FAIL on every gate. RULE 21: memory sampled.
# DEC-024: no durations estimated. DEC-025 / DEC-029 / DEC-026 observed.

on:
  workflow_dispatch:
    inputs:
      snapshot_tag:
        description: the tag printed by spike-s4a gate C06, e.g. s4a-snapshot-123456
        required: true
      continue_budget_seconds:
        description: seconds allowed for the resumed compile phase
        required: true
        default: "9000"

permissions:
  contents: read

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DEBIAN_FRONTEND: noninteractive
      SNAPSHOT_TAG: ${{ inputs.snapshot_tag }}
      COMPILE_BUDGET_SECONDS: ${{ inputs.continue_budget_seconds }}
      SAMPLE_INTERVAL_SECONDS: "300"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout fork with vanadium submodule
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          submodules: true
          fetch-depth: 1

      - name: R00 baseline
        run: |
          nproc; free -g; df -h /
          git --version
          echo "runner_os=$RUNNER_OS arch=$(uname -m)"
          echo "workspace_path=$GITHUB_WORKSPACE"
          echo 'PATH IDENTITY NOTE: if this differs from the S4A run, absolute'
          echo 'paths baked into the build files will not match and B04 will say so.'

      - name: R01 version proof
        run: |
          git log -1 --format='%H %ci %s'
          git -C vanadium log -1 --format='%H %ci'
          grep -E 'android_default_version_(name|code)' vanadium/args.gn
          echo "patches      : $(ls -1 vanadium/patches/*.patch | wc -l)"
          echo "subprojects  : $(find vanadium/subprojects_patches -name '*.patch' | wc -l)"

      - name: R02 inline disk reclamation
        run: |
          set +e
          avail() { df --output=avail -k / | tail -1; }
          BEFORE=$(avail)
          group() {
            local label=$1; shift; local b=$(avail)
            for p in "$@"; do
              if [ -e "$p" ]; then
                sz=$(du -sm "$p" 2>/dev/null | cut -f1)
                echo "  removing $p (${sz} MB)"
                sudo rm -rf "$p"
              else
                echo "  absent   $p"
              fi
            done
            local a=$(avail)
            echo "GROUP $label reclaimed $(( (a - b) / 1024 )) MB"
          }
          group G1-android /usr/local/lib/android
          group G2-dotnet /usr/share/dotnet
          group G3-haskell /opt/ghc /usr/local/.ghcup
          group G4-swift /usr/share/swift
          group G5-misc /usr/local/share/powershell /usr/share/miniconda /opt/az \
                        /usr/local/share/chromium /usr/local/lib/node_modules \
                        /usr/local/share/boost /opt/google /usr/lib/google-cloud-sdk \
                        /usr/local/graalvm /opt/pipx
          group G6-toolcache /opt/hostedtoolcache
          b7=$(avail); sudo docker system prune -af --volumes >/dev/null 2>&1; a7=$(avail)
          echo "GROUP G7-docker reclaimed $(( (a7 - b7) / 1024 )) MB"
          b8=$(avail)
          sudo apt-get purge -y firefox google-chrome-stable microsoft-edge-stable powershell libgl1-mesa-dri >/dev/null 2>&1
          sudo apt-get autoremove -y >/dev/null 2>&1
          sudo apt-get clean >/dev/null 2>&1
          a8=$(avail)
          echo "GROUP G8-apt reclaimed $(( (a8 - b8) / 1024 )) MB"
          echo "===== TOTAL INLINE RECLAIM: $(( ($(avail) - BEFORE) / 1024 )) MB ====="
          df -h /

      - name: R03 apt prerequisites
        run: |
          t0=$(date +%s)
          sudo apt-get update
          sudo apt-get install -y sudo lsb-release file nano git curl python3 python3-pillow imagemagick librsvg2-bin
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libgcc-s1:i386
          echo "elapsed_apt_seconds=$(( $(date +%s) - t0 ))"

      - name: R04 depot_tools
        run: |
          t0=$(date +%s)
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$GITHUB_WORKSPACE/depot_tools"
          echo "elapsed_depot_tools_seconds=$(( $(date +%s) - t0 ))"

      - name: R05 shallow single-tag Chromium fetch
        run: |
          export PATH="$GITHUB_WORKSPACE/depot_tools:$PATH"
          VERSION=$(grep -m1 -o '[0-9]\+\(\.[0-9]\+\)\{3\}' "$GITHUB_WORKSPACE/vanadium/args.gn")
          echo "VERSION=$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          t0=$(date +%s)
          mkdir -p "$GITHUB_WORKSPACE/chromium/src/out/Default"
          cd "$GITHUB_WORKSPACE/chromium/src"
          git init -q
          git remote add origin https://chromium.googlesource.com/chromium/src.git
          git fetch --depth 1 https://chromium.googlesource.com/chromium/src.git "+refs/tags/$VERSION:chromium_$VERSION"
          git checkout -q "$VERSION"
          echo "elapsed_fetch_seconds=$(( $(date +%s) - t0 ))"
          du -sh . ; du -sh .git ; df -h /

      - name: R06 GLOBAL git identity (DEC-032 - the proven fix)
        run: |
          git config --global user.email spike@example.invalid
          git config --global user.name spike
          git config --global --list | grep -E 'user\.(name|email)'
          echo 'identity is global, so every subproject repo inherits it'

      - name: R07 pruning and rename (build.sh lines 18-28)
        run: |
          cd "$GITHUB_WORKSPACE/chromium/src"
          cp "$GITHUB_WORKSPACE/.gclient" ../.gclient
          S="$GITHUB_WORKSPACE"
          echo "patches before pruning : $(ls -1 $S/vanadium/patches/*.patch | wc -l)"
          rm -rf $S/vanadium/patches/*trichrome-{apk-build-targets,browser-apk-targets}.patch
          rm -rf $S/vanadium/patches/*{detailed,supported}-language*.patch
          rm -rf $S/vanadium/patches/*component-updates.patch
          rm -rf $S/vanadium/patches/*{pdf,PDF,for-content-public,toolbar-button}*.patch
          echo "patches after pruning  : $(ls -1 $S/vanadium/patches/*.patch | wc -l)"
          t0=$(date +%s)
          find "$S/vanadium/patches" -type f -exec sed -i 's@VANADIUM@TITANIUM@g' {} \;
          find "$S/vanadium/patches" -type f -exec sed -i 's@Vanadium@Titanium@g' {} \;
          find "$S/vanadium/patches" -type f -exec sed -i 's@vanadium@titanium@g' {} \;
          echo "elapsed_replace_seconds=$(( $(date +%s) - t0 ))"

      - name: R08 git am the pruned patch series
        run: |
          set +e
          cd "$GITHUB_WORKSPACE/chromium/src"
          t0=$(date +%s)
          git am --whitespace=nowarn --keep-non-patch $GITHUB_WORKSPACE/vanadium/patches/*.patch > /tmp/am.log 2>&1
          rc=$?
          echo "elapsed_git_am_seconds=$(( $(date +%s) - t0 ))"
          echo "git_am_exit_code=$rc"
          echo "applying_lines: $(grep -c '^Applying: ' /tmp/am.log)"
          if [ $rc -ne 0 ]; then tail -n 40 /tmp/am.log; fi

      - name: R09 gclient sync --nohooks
        run: |
          export PATH="$GITHUB_WORKSPACE/depot_tools:$PATH"
          t0=$(date +%s)
          cd "$GITHUB_WORKSPACE/chromium/src"
          gclient sync -D --no-history --nohooks || echo 'SYNC RETURNED NONZERO'
          echo "elapsed_sync_seconds=$(( $(date +%s) - t0 ))"
          du -sh "$GITHUB_WORKSPACE/chromium" ; df -h /

      - name: R10 gclient runhooks with the UNMODIFIED .gclient - tests DEC-032
        run: |
          set +e
          export PATH="$GITHUB_WORKSPACE/depot_tools:$PATH"
          echo 'hook2 present in .gclient:' $(grep -c apply_subprojects_patches "$GITHUB_WORKSPACE/chromium/.gclient")
          cd "$GITHUB_WORKSPACE/chromium/src"
          t0=$(date +%s)
          gclient runhooks > /tmp/hooks.log 2>&1
          rc=$?
          echo "runhooks_exit_code=$rc"
          echo "elapsed_runhooks_seconds=$(( $(date +%s) - t0 ))"
          echo '----- IndexError present in hook output (0 means DEC-032 fixed it) -----'
          grep -c IndexError /tmp/hooks.log
          echo '----- subproject patch application lines -----'
          grep -E 'Applied successfully|Skipping patch application|aborting previous' /tmp/hooks.log
          echo '----- last 30 lines of hook output -----'
          tail -n 30 /tmp/hooks.log
          echo '----- VALIDITY GATE 1 (Rule 18): filter list -----'
          if [ -s titanium/android_config/filter_lists/filter_lists_easylist.txt ]; then
            echo "HOOK1 PASS filter list bytes: $(stat -c%s titanium/android_config/filter_lists/filter_lists_easylist.txt)"
          else
            echo 'HOOK1 FAIL'
          fi
          echo '----- VALIDITY GATE 2: are the v8 drumbrake patches in v8 history -----'
          git -C v8 log --oneline -3
          if git -C v8 log --oneline -5 | grep -qi drumbrake; then
            echo 'V8 SUBPROJECT PATCHES PRESENT via hook'
          else
            echo 'V8 SUBPROJECT PATCHES ABSENT - applying manually as fallback'
            for p in "$GITHUB_WORKSPACE"/vanadium/subprojects_patches/v8/*.patch; do
              git -C v8 am --whitespace=nowarn --keep-non-patch "$p" 2>&1 | tail -n 3
            done
            for p in "$GITHUB_WORKSPACE"/vanadium/subprojects_patches/third_party/search_engines_data/resources/*.patch; do
              git -C third_party/search_engines_data/resources am --whitespace=nowarn --keep-non-patch "$p" 2>&1 | tail -n 3
            done
            git -C v8 log --oneline -3
          fi
          echo "clang present: $(ls -1 third_party/llvm-build/Release+Asserts/bin/clang 2>/dev/null || echo NO)"
          du -sh "$GITHUB_WORKSPACE/chromium" ; df -h /

      - name: R11 install-build-deps
        run: |
          set +e
          cd "$GITHUB_WORKSPACE/chromium/src"
          ./build/install-build-deps.sh --no-prompt || echo 'INSTALL-BUILD-DEPS RETURNED NONZERO'
          df -h /

      - name: R12 patch.sh then args.gn arm64 then gn gen
        run: |
          set +e
          export PATH="$GITHUB_WORKSPACE/depot_tools:$PATH"
          cd "$GITHUB_WORKSPACE/chromium/src"
          export SCRIPT_DIR="$GITHUB_WORKSPACE"
          source "$GITHUB_WORKSPACE/common.sh" 2>/dev/null
          export SCRIPT_DIR="$GITHUB_WORKSPACE"
          t0=$(date +%s)
          source "$GITHUB_WORKSPACE/patch.sh" > /tmp/patch_sh.log 2>&1
          echo "patch_sh_exit_code=$?"
          echo "elapsed_patch_sh_seconds=$(( $(date +%s) - t0 ))"
          cp "$GITHUB_WORKSPACE/args.gn" out/Default/args.gn
          sed -i 's/target_cpu = "arm"/target_cpu = "arm64"/' out/Default/args.gn
          t0=$(date +%s)
          gn gen out/Default || echo 'GN GEN RETURNED NONZERO'
          echo "elapsed_gn_seconds=$(( $(date +%s) - t0 ))"
          echo "edges_COLD_before_restore: $(ninja -C out/Default -n chrome_public_apk 2>/dev/null | wc -l)"
          echo 'THAT NUMBER IS THE CONTROL. The restore must beat it or OQ-26 is answered NO.'
          df -h /

      - name: B01 fetch the snapshot from the draft Release
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/snap"; cd "$GITHUB_WORKSPACE/snap"
          T0=$(date +%s)
          gh release download "$SNAPSHOT_TAG" --pattern 'part.*' --pattern '*.sha256' 2>&1 | tail -n 5
          echo "gh_download_exit_code=$?"
          echo "elapsed_download_seconds=$(( $(date +%s) - T0 ))"
          ls -l
          echo '----- VALIDITY GATE B01 -----'
          if ls part.* >/dev/null 2>&1; then echo 'B01 PASS snapshot parts downloaded'; else echo 'B01 FAIL nothing downloaded - stop here, everything below is void'; fi

      - name: B02 reassemble and verify the snapshot byte for byte
        run: |
          set +e
          cd "$GITHUB_WORKSPACE/snap"
          cat part.* > outdefault.tar.zst
          echo "reassembled_bytes: $(stat -c%s outdefault.tar.zst)"
          echo "computed: $(sha256sum outdefault.tar.zst | cut -d' ' -f1)"
          echo "recorded: $(cut -d' ' -f1 outdefault.sha256 2>/dev/null)"
          echo '----- VALIDITY GATE B02 -----'
          A=$(sha256sum outdefault.tar.zst | cut -d' ' -f1)
          B=$(cut -d' ' -f1 outdefault.sha256 2>/dev/null)
          if [ -n "$B" ] && [ "$A" = "$B" ]; then echo 'B02 PASS snapshot is byte-identical after transport'; else echo 'B02 FAIL snapshot corrupted or hash missing - any resume result below is meaningless'; fi

      - name: B03 restore out/Default over the freshly generated tree
        run: |
          set +e
          which zstd || sudo apt-get install -y zstd
          cd "$GITHUB_WORKSPACE/chromium/src"
          echo "edges_before_restore: $(ninja -C out/Default -n chrome_public_apk 2>/dev/null | wc -l)"
          rm -rf out/Default
          T0=$(date +%s)
          tar -I zstd -xf "$GITHUB_WORKSPACE/snap/outdefault.tar.zst"
          echo "untar_exit_code=$?"
          echo "elapsed_unpack_seconds=$(( $(date +%s) - T0 ))"
          echo "restored_file_count: $(find out/Default -type f | wc -l)"
          du -sh out/Default
          echo "ninja_log_lines_restored: $(wc -l < out/Default/.ninja_log 2>/dev/null || echo 0)"
          echo '----- VALIDITY GATE B03 -----'
          if [ -f out/Default/build.ninja ] && [ -f out/Default/.ninja_log ]; then echo 'B03 PASS build.ninja and .ninja_log both restored'; else echo 'B03 FAIL restore incomplete'; fi
          df -h /

      - name: B04 THE OQ-26 ANSWER - remaining work, and ninja's own reason
        run: |
          set +e
          export PATH="$GITHUB_WORKSPACE/depot_tools:$PATH"
          cd "$GITHUB_WORKSPACE/chromium/src"
          R=$(ninja -C out/Default -n chrome_public_apk 2>/dev/null | wc -l)
          echo "edges_remaining_after_restore: $R"
          echo '----- WHY does ninja consider these edges dirty - its own words -----'
          ninja -C out/Default -n -d explain chrome_public_apk 2>&1 | grep -i '^ninja explain' | head -40
          echo "explain_line_count: $(ninja -C out/Default -n -d explain chrome_public_apk 2>&1 | grep -ci '^ninja explain')"
          echo '----- mtime evidence, the suspected cause -----'
          echo "newest SOURCE file mtime: $(find base -name '*.cc' -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -1)"
          echo "newest OBJECT file mtime: $(find out/Default/obj -name '*.o' -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -1)"
          echo "oldest OBJECT file mtime: $(find out/Default/obj -name '*.o' -printf '%T@ %p\n' 2>/dev/null | sort -n | head -1)"
          echo '----- VALIDITY GATE B04 - THIS IS THE GATING RESULT FOR D2 AND D3 -----'
          echo 'Compare edges_remaining_after_restore against edges_COLD_before_restore from R12.'
          echo 'Materially lower means RESUME and D2/D3 live. Equal or near-equal means'
          echo 'RESTART, and the explain lines above say exactly why. No estimate offered.'
          free -m

      - name: B05 resumed compile, memory sampled (RULE 21)
        run: |
          set +e
          export PATH="$GITHUB_WORKSPACE/depot_tools:$PATH"
          cd "$GITHUB_WORKSPACE/chromium/src"
          START=$(date +%s)
          nohup autoninja -C out/Default chrome_public_apk > /tmp/build.log 2>&1 &
          BPID=$!
          echo "build_pid=$BPID"
          while kill -0 "$BPID" 2>/dev/null; do
            NOW=$(date +%s); EL=$(( NOW - START ))
            if [ "$EL" -ge "$COMPILE_BUDGET_SECONDS" ]; then
              echo "BUDGET REACHED at ${EL}s - stopping"
              kill -INT "$BPID" 2>/dev/null; sleep 20; kill -9 "$BPID" 2>/dev/null
              break
            fi
            LASTP=$(grep -oE '\[[0-9]+/[0-9]+\]' /tmp/build.log 2>/dev/null | tail -n 1)
            MEM=$(free -m | awk '/^Mem:/{print "total="$2" used="$3" free="$4" avail="$7}')
            SWP=$(free -m | awk '/^Swap:/{print "swaptotal="$2" swapused="$3}')
            echo "SAMPLE elapsed=${EL}s progress=${LASTP:-none} load=$(cut -d' ' -f1-3 /proc/loadavg) free=$(df --output=avail -k / | tail -1) $MEM $SWP"
            sleep "$SAMPLE_INTERVAL_SECONDS"
          done
          wait "$BPID" 2>/dev/null
          echo "build_exit_code=$?"
          echo "elapsed_compile_seconds=$(( $(date +%s) - START ))"
          tail -n 40 /tmp/build.log
          echo "final_progress: $(grep -oE '\[[0-9]+/[0-9]+\]' /tmp/build.log | tail -n 1)"
          echo "error_lines: $(grep -c -iE '^(FAILED|ninja: build stopped|error:)' /tmp/build.log)"

      - name: B06 did an APK actually appear
        if: always()
        run: |
          set +e
          cd "$GITHUB_WORKSPACE/chromium/src"
          find out/Default -maxdepth 3 -name '*.apk' -printf '%s %p\n' 2>/dev/null | head -20
          echo '----- VALIDITY GATE B06 - MILESTONE M1b -----'
          if find out/Default -maxdepth 3 -name '*.apk' | grep -q apk; then
            echo 'B06 PASS an UNMODIFIED arm64 APK EXISTS - M1b reached'
            echo '----- what is inside it - answers the never-unpacked-APK question -----'
            A=$(find out/Default -maxdepth 3 -name '*.apk' | head -1)
            unzip -l "$A" | grep -iE '\.so$|lib/' | head -20
            unzip -l "$A" | tail -3
          else
            echo 'B06 RESULT no APK yet - the build did not reach the end within budget'
          fi
          df -h /; free -m

      - name: B07 FINAL SUMMARY
        if: always()
        run: |
          echo '================ SPIKE S4B SUMMARY ================'
          echo "snapshot_tag_used: $SNAPSHOT_TAG"
          df -h /; free -m
          echo 'Copy this entire log back into the chat.'
